  var hotId = null, activeId = null, hoverId = null;

  function button(id, x, y, w, h, label, opts) {
    opts = opts || {};

    var r = hitArea(id, x, y, w, h, en);
    var S = G.spr, sp;
    var style = opts.style || 'brass';

    else if (r.state === 'hover') sp = style === 'core' ? S.btnCoreHover : S.btnHover;

})();

<script>

<script>

  // ── 붕괴 ───────────────────────────────────────

  // ── 기록 ───────────────────────────────────────
  function records(s) {

    U.groove(X0, Y0 + 19, W0);

    var y = Y0 + 26;
    G.ACH.forEach(function (a, i) {

      var h = U.hitArea('ac' + a[0], x, yy, 24, 26);

  }
  function stats(s, y) {

    var rows = [
      ['st_time', G.fmtTime(s.t)], ['st_rolls', G.fmt(st.rolls)], ['st_manual', G.fmt(st.manual)], ['st_aligns', G.fmt(st.aligns)], ['st_events', G.fmt(st.events)],
      ['st_best', G.nm('tiers', Math.max(1, st.bestTier))], ['st_hit', G.fmt(st.bestHit)], ['st_rare', '×' + G.fmt(st.bestRarity, true)], ['st_dust', G.fmt(s.dustAll)],
      ['st_novas', G.fmt(s.novas)], ['st_fast', st.fastestNova ? G.fmtTime(st.fastestNova) : '-'], ['st_cores', G.fmt(s.coresAll)], ['st_cols', G.fmt(s.collapses)], ['st_sing', G.fmt(s.singAll)]
    ];
    rows.forEach(function (r, i) {
      var yy = y + i * 18;
      if (i > 0) U.groove(X0, yy - 3, W0);
      F.draw(G.T(r[0]), X0 + 2, yy + 1, 15, 'g11');
      F.drawRight(r[1], X0 + W0 - 2, yy + 1, 4, 'g11b');
    });
  }

  // ── 탭 틀 ──────────────────────────────────────
  function dotFor(s, key) {
    if (key === 'upg') return G.UPGRADES.some(function (u) { return !s.up[u.id] && C.upgradeVisible(s, u) && s.dust >= u.cost; });
    if (key === 'nova') return C.canNova(s) || G.RESEARCH.some(function (r) { return C.researchAvail(s, r) && s.cores >= r.cost; });
    if (key === 'col') return C.canCollapse(s) || G.SRESEARCH.some(function (r) { return C.sresAvail(s, r) && s.sing >= r.cost && (r.eff !== 'ending' || Object.keys(s.chalDone).length >= 6); });
    return false;
  }
  function draw(s, PX, PY, PW, PH) {
    X0 = PX + 8; Y0 = PY + 30; W0 = PW - 16;
    var keys = ['machine', 'upg', 'dice', 'nova', 'col', 'rec'];
    var items = keys.map(function (k) { return { key: k, label: G.T('tab_' + k), hidden: !A.tabOpen(k), dot: dotFor(s, k) && A.tab !== k }; });
    if (!A.tabOpen(A.tab)) A.tab = 'machine';

    var nt = U.tabs('tab', PX + 10, PY + 9, items, A.tab, { gap: gap, font: tfont });
    if (nt !== A.tab) { A.tab = nt; A.seenTabs[nt] = 1; }

    if (A.tab === 'machine') machine(s);
    else if (A.tab === 'upg') upgrades(s);
    else if (A.tab === 'dice') dicePanel(s);
    else if (A.tab === 'nova') novaPanel(s);
    else if (A.tab === 'col') colPanel(s);
    else if (A.tab === 'rec') records(s);
  }
  G.panels = { draw: draw, histogram: histogram };
})();

<script>
// 겹 창: 설정, 복귀 리포트, 확인
(function () {
  var A = G.app, gx = G.gfx, F = G.font, U = G.ui;
  function dim() { // 뒤 화면을 어둡게: 팔레트 안에서 한 단계씩 어두운 색으로 치환

  }
  function settings(s, fromTitle) {

      if (U.button('sv', lx, yy, bw, 19, G.T('b_save'), { font: 'g11b' })) { s.seenTabs = A.seenTabs; var rr = G.save.save(s); A.notify([rr === true ? G.T('saved') : (rr === 'locked' ? G.T('save_locked') : G.T('save_fail'))], 'info'); }
      if (U.button('ex', lx + bw + 6, yy, bw, 19, G.T('b_export'), { font: 'g11b' })) exportSave(s);

  }
  function toggleFs() {

  }

  var A = G.app, gx = G.gfx, F = G.font, U = G.ui, O = G.orrery;
  var CX = O.CX, CY = O.CY;
  function ring(cx, cy, r, cols, th) {
    for (var yy = -r - th; yy <= r + th; yy++) for (var xx = -r - th; xx <= r + th; xx++) {
      var d = Math.sqrt(xx * xx + yy * yy * 2.2);
      if (d <= r && d > r - th) {
        var k = (r - d) / th;
        gx.pset(cx + xx, cy + yy, k < 0.34 ? cols[0] : (k < 0.67 ? cols[1] : cols[2]));
      }
    }
  }
  function flashFill(k, c) { // k: 0..1 덮는 비율 (Bayer 문턱)
    for (var y = 20; y < 244; y++) for (var x = 0; x < 416; x++) if (gx.bayer(x, y) < k) gx.pset(x, y, c);
  }
  function cutDraw(c, v, t) {
    if (c.kind === 'nova') {
      O.draw(v, t, {});
      gx.setClip(0, 20, 416, 224);
      if (c.t < 1.1) {
        var k = c.t / 1.1;
        var r = Math.round(14 + k * k * 120);
        for (var yy = -r; yy <= r; yy++) for (var xx = -r; xx <= r; xx++) {
          var d = Math.sqrt(xx * xx + yy * yy);
          if (d > r) continue;
          var q = d / r;
          var col = q < 0.5 ? 4 : (q < 0.75 ? 3 : (q < 0.92 ? 7 : 5));
          if (q > 0.92 && gx.bayer(CX + xx, CY + yy) < (q - 0.92) * 10) continue;
          gx.pset(CX + xx, CY + yy, col);
        }
        if (!c.parts && k > 0.85) { c.parts = 1; O.burst(CX, CY, A.s.settings.reduce ? 10 : 60, [4, 3, 7, 8], 120); }
      } else if (c.t < 1.8) {
        var f = 1 - (c.t - 1.1) / 0.7;
        if (!A.s.settings.reduce) flashFill(f, f > 0.5 ? 4 : 8);
        ring(CX, CY, Math.round((c.t - 1.1) * 260), [4, 3, 7], 5);
      } else if (c.t < 2.8) {
        ring(CX, CY, Math.round((c.t - 1.1) * 260), [8, 7, 5], 3);
      }
      gx.resetClip();
      return true;
    }
    if (c.kind === 'col') {
      if (c.t < 1.6) {
        // 모든 천체가 소용돌이치며 중심으로
        var k2 = c.t / 1.6;
        G.starfield.draw(v.stage, t, 0, 0, 0, 20, 416, 246);
        gx.setClip(0, 20, 416, 224);
        var L = v._layout;
        Object.keys(v.bodies).forEach(function (key) {
          var b = v.bodies[key], o = L && L.map[key]; if (!o) return;
          var rr = 1 - k2 * k2;
          var a = b.a0 + t * 0.3 + k2 * k2 * 9;
          var x = Math.round(CX + Math.cos(a) * o.rx * rr), y = Math.round(CY + Math.sin(a) * o.ry * rr);
          var sp = G.planets.bodySprite(b.t, b.seed, 0);
          gx.blit(sp, x - (sp.w >> 1), y - (sp.h >> 1));
        });
        var sun = G.planets.sunSprite(v.sunForm, Math.floor(t * 6) % 48);
        if (k2 < 0.7) gx.blit(sun, CX - (sun.w >> 1), CY - (sun.h >> 1));
        hole(Math.round(k2 * 22), t);
        gx.resetClip();
        return true;
      }
      O.draw(v, t, {});
      gx.setClip(0, 20, 416, 224);
      var k3 = Math.max(0, 1 - (c.t - 1.6) / 2.2);
      if (k3 > 0) hole(Math.round(22 * k3), t);
      gx.resetClip();
      return true;
    }
    return false;
  }
  function hole(r, t) {
    if (r <= 0) return;
    for (var yy = -r * 2; yy <= r * 2; yy++) for (var xx = -r * 3; xx <= r * 3; xx++) {
      var d2 = xx * xx + yy * yy;
      var e = (xx * xx) / (9 * r * r) + (yy * yy) / (r * r * 0.5);
      if (d2 <= r * r * 0.5) gx.pset(CX + xx, CY + yy, 0);
      else if (d2 <= r * r * 0.75) gx.pset(CX + xx, CY + yy, ((xx + yy + Math.floor(t * 8)) & 3) ? 6 : 19);
      else if (e <= 1 && e > 0.35) gx.pset(CX + xx, CY + yy, e > 0.8 ? 6 : (((xx + Math.floor(t * 14)) & 7) < 2 ? 19 : 16));
    }
  }
  function cutText(c) {
    var t0 = c.kind === 'nova' ? 1.3 : 1.8, t1 = c.kind === 'nova' ? 3.4 : 4.0;
    if (c.t < t0 || c.t > t1) return;
    var title = c.kind === 'nova' ? G.T('nova_title') : G.T('col_title');
    var ramp = c.kind === 'nova' ? [4, 3, 11] : [19, 16, 6];
    var w = G.embossMeasure(title, 3);
    var slide = Math.min(1, (c.t - t0) / 0.2);
    G.embossText(title, Math.round(CX - w / 2), Math.round(60 - (1 - slide) * 10), 3, ramp, 'g11b', 12);
    var g = c.kind === 'nova' ? G.T('nova_gain', G.fmt(c.gain)) : G.T('col_gain', G.fmt(c.gain));
    F.drawCenter(g, CX, 104, c.kind === 'nova' ? 7 : 19, 'g11b', 12);
  }

  // ── 엔딩 ───────────────────────────────────────
  function ending(dt) {
    A.endT = (A.endT || 0) + dt;
    var t = A.endT, s = A.s;
    var v = G.scenePlay.buildView(s);
    v.alignK = Math.min(1, t / 4);
    G.starfield.draw(4, A.t, 0, 0, 0, 0, 640, 360);
    O.draw(v, A.t, { noRuler: true });
    // 오른쪽: 문장 하나씩
    var lx = 430, lines = [G.T('end1'), G.T('end2'), G.T('end3')];
    var yy = 70;
    lines.forEach(function (l, i) {
      var st = 4.5 + i * 2.6;
      var wl = F.wrap(l, 200, 'g11b');
      if (t >= st) wl.forEach(function (w2, j) { F.drawOutlined(w2, lx, yy + j * 14, t - st < 0.3 ? 8 : 4, 'g11b', 12); });
      yy += wl.length * 14 + 10;
    });
    if (t > 13) {
      var lf = G.getLang() === 'en' ? 'g11b' : 'logo';
      var ek = G.embossMeasure(G.T('cr_game'), 3, lf) > 200 ? 2 : 3;
      G.embossText(G.T('cr_game'), lx, 200, ek, [4, 3, 11], lf, 12);
      F.drawOutlined(G.T('end_thanks'), lx, 248, 8, 'g11', 12);
    }
    if (t > 14.5) {
      if (U.button('endc', lx, 274, 110, 20, G.T('b_continue'), { font: 'g11b' })) { v.alignK = 0; s.endSeen = true; A.scene = 'play'; G.save.save(s); }
    } else if (t > 4 && t < 13 && U.inp.released) A.endT = 13;
  }

  // ── 크레딧 ─────────────────────────────────────
  function credits(dt) {
    G.overlays.dim();
    var w = 340, h = 220, x = (640 - w) >> 1, y = (360 - h) >> 1;
    G.nine(G.spr.panel, x, y, w, h);
    G.embossText(G.T('cr_game'), x + 14, y + 12, 2, [4, 3, 11], G.getLang() === 'en' ? 'g11b' : 'logo', 12);
    var rows = [['cr_made', 'cr_made2'], ['cr_font', 'cr_font2'], ['cr_pal', 'cr_pal2'], ['cr_sound', 'cr_sound2'], ['cr_tool', 'cr_tool2']];
    rows.forEach(function (r, i) {
      var yy = y + 52 + i * 28;
      if (i > 0) U.groove(x + 10, yy - 5, w - 20);
      F.draw(G.T(r[0]), x + 14, yy, 15, 'g9');
      F.draw(G.T(r[1]), x + 14, yy + 11, 4, 'g11');
    });
    if (U.button('crc', x + w - 92, y + h - 28, 80, 19, G.T('b_close'), { font: 'g11b' }) || U.inp.keysPressed.Escape) A.overlay = A.scene === 'title' ? null : 'settings';
  }
  G.sceneFx = { cutDraw: cutDraw, cutText: cutText, ending: ending, credits: credits };
})();

</script>
<script>
// 개발·검수용 진입: ?demo=early|mid|late|col|end  (+&speed=N 시간 배속)
(function () {
  var C = G.core;
  function bot(s, secs) {
    var dt = 1, R = Math.random;
    for (var t = 0; t < secs; t += dt) {
      if (C.derive(s).interval === 0 || t < 300) { s.manualCd = 0; C.manualRoll(s); }
      C.tick(s, dt, {});
      if (s.ev.cur) C.catchEvent(s);
      var g = 0;
      while (g++ < 30) {
        var ups = G.UPGRADES.filter(function (u) { return !s.up[u.id] && C.upgradeVisible(s, u) && s.dust >= u.cost; });
        if (ups.length) { C.buyUpgrade(s, ups[0].id); continue; }
        if (s.dust >= C.costDie(s)) { C.buyDie(s); continue; }
        if (C.forgeUnlocked(s) && s.dust >= C.costForge(s) * 4) { var di = Math.floor(R() * s.dice.length), f = Math.floor(R() * s.dice[di].faces.length); if (C.forge(s, di, f, s.dice[di].faces[f] < 4 ? 1 : 1)) continue; }
        if (s.dust >= C.costWind(s) && C.costWind(s) <= C.costPower(s) * 1.5 && (C.derive(s).interval === 0 || C.derive(s).interval > 0.06)) { C.buyWind(s); continue; }
        if (s.dust >= C.costPower(s)) { C.buyPower(s); continue; }
        break;
      }
      var av = G.RESEARCH.filter(function (r) { return C.researchAvail(s, r) && s.cores >= r.cost; });
      if (av.length) C.buyResearch(s, av[0].id);
      var sv = G.SRESEARCH.filter(function (r) { return C.sresAvail(s, r) && s.sing >= r.cost && r.eff !== 'ending'; });
      if (sv.length) C.buySres(s, sv[0].id);
    }
  }
  G.devDemo = function (q) {
    var m = /demo=(\w+)/.exec(q); var name = m ? m[1] : '';
    var sp = /speed=(\d+)/.exec(q); if (sp) window.__timeScale = +sp[1];
    var s = C.newState(); s.settings.muted = true;
    var A = G.app; A.s = s; A.demo = true;
    if (name === 'fresh') { }
    if (name === 'early') bot(s, 150);
    if (name === 'mid') bot(s, 1500);
    if (name === 'late' || name === 'col' || name === 'end') {
      bot(s, 2400);
      for (var n = 0; n < (name === 'late' ? 4 : 9); n++) { while (!C.canNova(s)) bot(s, 300); C.nova(s); bot(s, 60); }
      bot(s, 1200);
    }
    if (name === 'col' || name === 'end') {
      var guard = 0;
      while (!C.canCollapse(s) && guard++ < 200) { bot(s, 300); if (C.canNova(s) && !C.canCollapse(s)) C.nova(s); }
      if (C.canCollapse(s)) C.collapse(s);
      s.sing += 200; s.singAll += 200;
      ['q1', 'q2', 'q3', 'q4', 'q5', 'q6', 'q7', 'q8'].forEach(function (id) { C.buySres(s, id); });
      C.setShape(s, 0, 'd8'); C.setShape(s, 1, 'd12');
      bot(s, 900);
    }
    if (name === 'end') { G.CHALLENGES.forEach(function (c) { s.chalDone[c.id] = 1; }); s.sing += 999; ['q9', 'q10', 'q11', 'q12'].forEach(function (id) { C.buySres(s, id); }); }
    C.invalidate();
    A.seenTabs = { machine: 1, rec: 1, upg: 1, dice: 1, nova: 1, col: 1, n_upg: 1, n_dice: 1, n_nova: 1, n_col: 1, n_chal: 1 };
    C.achQueue.length = 0;
    var d = C.derive(s);
    G.tray.place(d.dice.map(A.spec), d.dice.map(function () { return 0; }));
    A.applySettings();
    A.scene = 'play';
    var tab = /tab=(\w+)/.exec(q); if (tab) A.tab = tab[1];
    var sub = /sub=(\w+)/.exec(q); if (sub) { A.sub.nova = sub[1]; A.sub.rec = sub[1]; }
    if (/ov=settings/.test(q)) A.overlay = 'settings';
    if (/ov=away/.test(q)) { A.away = { secs: 3 * 3600 + 720, dust: 1.23e9, rolls: 5400, tierUps: 14, eff: 0.5 }; A.overlay = 'away'; }
    if (/ov=credits/.test(q)) A.overlay = 'credits';
    if (/ev=1/.test(q)) C.spawnEvent(s);
    if (/nova=1/.test(q) && C.canNova(s)) A.startNova();
  };
})();

</script>
<script>
// 시작점
G.app.boot();

</script>
